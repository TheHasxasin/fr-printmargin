<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9C80F6"/><stop offset=".47" stop-color="#72B9F5"/><stop offset="1" stop-color="#7FE8CA"/></linearGradient>
 <linearGradient id="paper" x1="0" y1="0" x2=".5" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#E9EEFF"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset="1" stop-color="#ECF2FF"/></linearGradient>
 <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#7267D8"/><stop offset="1" stop-color="#4859B9"/></linearGradient>
 <linearGradient id="orange" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFD5AA"/><stop offset="1" stop-color="#FF947C"/></linearGradient>
 <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="24" stdDeviation="25" flood-color="#3F419E" flood-opacity=".28"/></filter>
 <filter id="smallShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#4853AB" flood-opacity=".22"/></filter>
</defs>
<rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
<circle cx="166" cy="170" r="260" fill="#FFFFFF" opacity=".14"/>
<circle cx="930" cy="800" r="230" fill="#BFFFEA" opacity=".26"/>
<path d="M90 760 Q260 630 420 810 T920 790" stroke="#FFFFFF" stroke-width="24" opacity=".15" fill="none"/>
<!-- page feed, gently bent -->
<g filter="url(#smallShadow)"><rect x="292" y="162" width="435" height="388" rx="36" fill="url(#paper)"/>
<rect x="342" y="214" width="200" height="26" rx="13" fill="#9081EB" opacity=".9"/>
<rect x="342" y="263" width="293" height="20" rx="10" fill="#C4B8F5"/>
<rect x="342" y="298" width="255" height="20" rx="10" fill="#E2DCFA"/>
<rect x="342" y="356" width="109" height="78" rx="16" fill="#C4F4E7"/>
<rect x="467" y="356" width="158" height="18" rx="9" fill="#D4DDF6"/>
<rect x="467" y="392" width="128" height="18" rx="9" fill="#DFE5F9"/>
</g>
<!-- printer body -->
<g filter="url(#shadow)"><rect x="166" y="397" width="693" height="346" rx="95" fill="url(#front)"/>
<rect x="166" y="397" width="693" height="205" rx="88" fill="#EEF2FF"/>
<path d="M166 523 Q166 603 255 603 H775 Q859 603 859 523" fill="#DFE8FA"/>
<rect x="263" y="582" width="498" height="138" rx="39" fill="url(#violet)"/>
<rect x="292" y="600" width="438" height="115" rx="28" fill="#4F5CC5" opacity=".55"/>
<circle cx="762" cy="484" r="26" fill="#84DDC8"/>
<circle cx="762" cy="484" r="11" fill="#FFFFFF"/>
</g>
<!-- sheet emerging from front and sticker bar motifs -->
<g filter="url(#smallShadow)"><rect x="328" y="617" width="365" height="221" rx="26" fill="#FFFFFF"/>
<rect x="368" y="667" width="78" height="78" rx="20" fill="#AEE8F6"/>
<path d="M385 706 l17 17 29-39" stroke="#566FC3" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<rect x="470" y="668" width="171" height="20" rx="10" fill="#C4B8F5"/>
<rect x="470" y="706" width="133" height="20" rx="10" fill="#D9DDF5"/>
<rect x="367" y="769" width="272" height="14" rx="7" fill="#E5E9FA"/>
</g>
<!-- large discount tag -->
<g transform="rotate(13 758 756)" filter="url(#smallShadow)">
<rect x="673" y="662" width="190" height="190" rx="55" fill="url(#orange)" stroke="#FFFFFF" stroke-width="13"/>
<text x="768" y="798" text-anchor="middle" font-family="DejaVu Sans, Arial, sans-serif" font-size="124" font-weight="bold" fill="#FFFFFF">%</text>
</g>
<!-- tiny highlight spark -->
<path d="M242 164 L259 204 299 221 259 239 242 279 225 239 185 221 225 204 Z" fill="#FFFFFF" opacity=".88"/>
</svg>